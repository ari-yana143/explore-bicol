<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beaches – Explore Bicol</title>
  <meta name="description" content="Beaches across the six provinces of Bicol.">
  <script>try{var t=localStorage.getItem('bicolTheme');if(t)document.documentElement.setAttribute('data-bs-theme',t)}catch(e){}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/explore-bicol-mark.svg">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="beaches">
  <div id="site-header"></div>
  <main>
    <section class="hero hero-sm" aria-label="Beaches">
      <img class="hero-bg" src="images/hero/hero-beaches.jpg" alt="White sand beach with clear water" loading="lazy" onerror="Site.fallback(this)">
      <div class="hero-overlay"></div>
      <div class="container hero-content"><span class="hero-number" aria-hidden="true">01</span><span class="hero-badge">Sun &amp; Sea</span><h1 class="mt-3">Beaches of Bicol</h1><p class="lead">Surf breaks, hidden coves and island sandbars from Calaguas to Sorsogon.</p></div>
    </section>
    <section class="section">
      <div class="container">
        <div class="d-flex flex-wrap gap-2 mb-2" id="filters" role="group" aria-label="Filter by province"></div>
        <p class="text-muted small mb-4" id="count" aria-live="polite"></p>
        <div class="row g-4" id="grid"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
