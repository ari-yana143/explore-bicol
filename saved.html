<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved Places – Explore Bicol</title>
  <meta name="description" content="Keep your favorite Bicol provinces, destinations, festivals, and food in one place.">
  <script>try{var t=localStorage.getItem('bicolTheme');if(t)document.documentElement.setAttribute('data-bs-theme',t)}catch(e){}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/explore-bicol-mark.svg">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="saved">
  <div id="site-header"></div>
  <main>
    <section class="hero hero-sm" aria-label="Saved places">
      <img class="hero-bg" src="images/hero/hero-contact.jpg" alt="" loading="lazy" onerror="Site.fallback(this)">
      <div class="hero-overlay"></div>
      <div class="container hero-content"><span class="hero-badge">Your shortlist</span><h1 class="mt-3">Saved Places</h1><p class="lead">Keep the Bicol places you want to come back to.</p></div>
    </section>
    <section class="section">
      <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
          <div><div class="section-kicker">Your favorites</div><h2 class="section-title">Places to Remember</h2></div>
          <p class="text-muted mb-0" id="savedCountText" aria-live="polite"></p>
        </div>
        <div class="row g-4" id="savedGrid"></div>
        <p class="small text-muted mt-4">Saved places are stored only in this browser on this device.</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
